[package]
# The reader backend is a separate executable so writer startup stays lean.
name = "liminaldoc-reader"
description = "Native Liminaldoc reader backend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "liminaldoc-reader"
path = "src/main.rs"

[lib]
name = "liminaldoc_reader"
path = "src/lib.rs"

[[example]]
name = "pdf_parallel_profile"
path = "examples/pdf_parallel_profile.rs"
required-features = ["pdf-engine"]

[[example]]
name = "pdf_tile_profile"
path = "examples/pdf_tile_profile.rs"
required-features = ["pdf-engine"]

[[example]]
name = "pdf_startup_profile"
path = "examples/pdf_startup_profile.rs"
required-features = ["pdf-engine"]

[features]
default = ["wgpu-presenter", "softbuffer-presenter", "pdf-engine"]
softbuffer-presenter = ["dep:softbuffer"]
pdf-engine = [
    "dep:pdf-source",
    "dep:pdf-document",
    "dep:pdf-security",
    "dep:pdf-content",
    "dep:pdf-text",
    "dep:pdf-page-ir",
    "dep:pdf-render-api",
    "dep:pdf-render-cpu",
    "dep:pdf-render-wgpu",
]
wgpu-presenter = ["dep:lege-gpu"]

[dependencies]
arc-swap.workspace = true
crossbeam-channel.workspace = true
thiserror.workspace = true
winit.workspace = true
cosmic-text.workspace = true
arboard.workspace = true
pdf-font.workspace = true
pulldown-cmark.workspace = true
tempfile.workspace = true
open.workspace = true
# The same vendored dialog crate both Lege GUIs use.
rfd = { path = "../../../Lege-ecosystem/lege-process/GUI/rfd" }
serde.workspace = true
serde_json.workspace = true
softbuffer = { workspace = true, optional = true }
lege-gpu = { path = "../../../Lege-ecosystem/lege-gpu", optional = true, features = ["presentation"] }

pdf-source = { workspace = true, optional = true }
pdf-document = { workspace = true, optional = true }
# Needed only to tell "this document wants a password" apart from "this file
# is broken": the distinction is a typed `SecurityError`, and a viewer that
# matched on the message text would start failing silently the day it changed.
pdf-security = { workspace = true, optional = true }
pdf-content = { workspace = true, optional = true }
pdf-text = { workspace = true, optional = true }
pdf-page-ir = { workspace = true, optional = true }
pdf-render-api = { workspace = true, optional = true }
pdf-render-cpu = { workspace = true, optional = true }
pdf-render-wgpu = { workspace = true, optional = true }

[lints]
workspace = true

[dev-dependencies]
pdf-test-support.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"
